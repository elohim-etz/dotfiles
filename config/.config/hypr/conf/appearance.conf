general {
    gaps_in = 2
    gaps_out = 1

    border_size = 1

    col.active_border = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.inactive_border = rgba(b4befecc) rgba(6c7086cc) 45deg

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}


decoration {
    rounding = 4

    active_opacity = 1
    inactive_opacity = 1

    blur {
        enabled = yes
        size = 5
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.0
        popups = true
    }

    shadow {
      enabled = false
      range = 10
      scale = 2
      render_power = 5
      color = $surface0
      color_inactive = $crust
    }

    dim_inactive = false
    dim_strength = 0.05
}
