##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps
windowrulev2 = suppressevent maximize, class:.*

# Fix dragging issues with XWayland ghost windows
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

windowrulev2 = opacity 0.90 0.90 1.0, class:^(kitty)$
windowrulev2 = opacity 0.90 0.90 1.0, class:^(nemo)$
windowrulev2 = opacity 0.80 0.70 1.0, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = opacity 0.80 0.70 1.0, class:^(blueman-manager)$
windowrulev2 = opacity 0.80 0.70 1.0, class:^(nm-applet)$
windowrulev2 = opacity 0.80 0.70 1.0, class:^(nm-connection-editor)$

windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = size 600 400, class:^(blueman-manager)$

windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(nm-applet)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$

windowrulev2 = float, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = size 800 1000, class:^(Xdg-desktop-portal-gtk)$

layerrule = match:namespace ^(waybar)$, blur 1
layerrule = match:namespace ^(wofi)$, blur 1
